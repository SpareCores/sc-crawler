name: Unit tests
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.11
      - name: Install tox
        run: pip install tox
      - name: Install local pkg
        run: pip install .
      - name: Tests
        run: tox
      - name: Linters
        run: tox -e lint

  # the Crawler and Schemas sections of docs.sparecores.com are generated from
  # this repo, so let's make sure that it still works
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.13
      # fails on e.g. unresolved references or undocumented enum values
      - name: Generate the docs
        run: |
          pip install ".[mkdocs]"
          python scripts/gen_md_docs.py
