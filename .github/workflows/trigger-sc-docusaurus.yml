name: Trigger docs rebuild

on:
  push:
    branches:
      - main
    paths:
      # the Crawler docs and reference, and the Schemas (scripts/gen_md_docs.py)
      - 'src/sc_crawler/**'
      - 'docs/**'
      - 'CHANGELOG.md'
      - 'scripts/gen_md_docs.py'

jobs:
  dispatch:
    name: Dispatch docs deploy workflow
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Trigger SpareCores/sc-docusaurus deploy.yml
        env:
          GH_TOKEN: ${{ secrets.SC_DOCS_DISPATCH_TOKEN }}
        run: >
          gh workflow run deploy.yml
          --repo SpareCores/sc-docusaurus
          --ref main
          -f source=${{ github.event.repository.name }}
