# Persistent verdicts on `sc-audit` findings, applied on every `compare` run.
#
# Each entry matches findings by the given criteria (all must match; first
# matching entry wins, so put specific entries before general ones):
#   vendor (required), type, field, region,
#   match: regex (full match) on our id or the vendor SKU,
#   page: regex on the page id,
#   ours / theirs: pin values as shown in the report; the entry stops
#     applying when either value changes (so the finding comes back).
#
# verdict:
#   confirmed       real problem in our data (add `issue` when filed)
#   false_positive  the finding is wrong (extraction error, naming, units)
#   expected        known, accepted difference (by design, modelling choice)
#   to_verify       needs a check against the vendor API/console
# false_positive and expected are left out of report.md (kept in findings.csv).
#
# Entries matching no finding anymore are listed as stale in report.md.

entries:

  # ---------------------------------------------------------------- hcloud
  - vendor: hcloud
    type: SPEC_MISMATCH
    field: memory_gib
    match: "(CAX|CCX|CPX|CX)\\d+"
    verdict: false_positive
    note: "_hcloud.py:417 multiplies the API's GB value by 1000 instead of 1024 (all SKUs -2.34%). Not a bug: Hetzner's \"GB\" is 1000 MiB, dmidecode in sc-inspector-data shows 4000 MB on cx22/cx23/cpx22/cax11 and 16 GB + 7616 MB = 24000 MiB on cpx52, so memory * 1000 (MiB) is right."
    by: bridgend84
    evidence: audit-runs/2026-10-31.tar.xz
    date: 2026-11-02
  - vendor: hcloud
    type: PRICE_MISSING_IN_DB
    match: "(CAX\\d+|CX[2-5]3|CPX[1-5]1)"
    verdict: expected
    note: "Page shows the 'from' price for the cheapest locations; we lack prices there. Check per-location availability at crawl time. Verified against the API on 2026-11-02: our prices exist but are INACTIVE where the type is sold out (available false, e.g. cx23-53, cax*) or retired (cpx11-51 in EU/sin, unavailable_after 2025-12-31); the audit only exports ACTIVE prices."
    by: bridgend84
    evidence: audit-runs/2026-10-31.tar.xz
    date: 2026-11-02

  # ---------------------------------------------------------------- aws
  - vendor: aws
    type: SOURCE_CONFLICT
