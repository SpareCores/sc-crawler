    verdict: expected
    note: "Our price is 21% higher than the prices page (EUR 0.1034 vs 0.0855/h); all other PostgreSQL plans match. Ours follows the order catalog (2026-11-02): databases.postgresql-discovery-b3-4.hour.consumption is 0.10338 EUR/h (GRA and other 1-AZ regions), 0.10948 in 3-AZ and 0.085539 in APAC regions; the prices page shows the APAC rate for b3-4 only (b3-8 agrees at 0.1962)."
    by: bridgend84
