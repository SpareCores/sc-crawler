    type: MISSING_IN_DB
    match: "m4n?-hypermem-.*"
    verdict: expected
    note: "Documented machine types we don't have. In the live API (48 zones) and ACTIVE in the 2026-11-02 pull: the audited dump predates them; remove when stale."
    by: bridgend84
    evidence: audit-runs/2026-10-31.tar.xz
    date: 2026-11-02
  - vendor: gcp
    type: NOT_AT_VENDOR
    match: "(x4-megamem-\\d+-metal|a3-\\w+-8g-nolssd)"
    verdict: false_positive
    note: "Not in the docs tables, which may not list every variant. The machine types API lists them (2026-11-02): x4-megamem-960/1440/1920-metal in 18-19 zones, a3-edgegpu-8g-nolssd in 24 and a3-ultragpu-8g-nolssd in 9 zones."
    by: bridgend84
    evidence: audit-runs/2026-10-31.tar.xz
    date: 2026-11-02
  - vendor: gcp
    type: NOT_AT_VENDOR
    match: "db-(n1-(standard|highmem)|memory-optimized-N)-\\d+"
    verdict: false_positive
    note: "Legacy Cloud SQL tiers not mentioned by the current machine series docs (Enterprise: shared-core, general purpose, N4; Enterprise Plus: N2, C4A, C4). May still be creatable via the API: verify, or mark as deprecated. Still offered: sqladmin tiers.list returns db-n1-standard/highmem and db-memory-optimized-N tiers in 40-43 regions (2026-11-02)."
    by: bridgend84
    evidence: audit-runs/2026-10-31.tar.xz
    date: 2026-11-02

  # ---------------------------------------------------------------- alicloud
  - vendor: alicloud
    type: NOT_AT_VENDOR
    verdict: expected
    note: "Mostly old families (n1/n2/e3/s2/s3/c1/c2/m1/sn1/sn2/d1/i1) missing from the current docs: phased out but ACTIVE for us? Some new families (g8ise, c9h, gn8ia) are also missing from the docs page. Still orderable via the API (2026-11-02): DescribeAvailableResource has WithStock for c1/c2/s2/s3/m1 in ap-southeast-5, i1 in cn-hongkong, d1 in cn-beijing/chengdu/hangzhou, n1/n2/e3/sn1/sn2 in several regions; the retired-instance-types page lists them as retired on the China website only. g8ise/c9h/gn8ia are newer than the docs page."
    by: bridgend84
    evidence: audit-runs/2026-10-31.tar.xz
    date: 2026-11-02
  - vendor: alicloud
    type: STATUS_MISMATCH
    verdict: expected
    note: "Documented, but INACTIVE for us (status from per-region DescribeAvailableResource). 2026-11-02: of the publicly priced but INACTIVE types, most are WithoutStock in every zone (fixed: _ALICLOUD_STATUS_CATEGORY_TO_SERVER_LIFECYCLE keeps them ACTIVE, per-zone prices stay INACTIVE); the rest are not returned by DescribeAvailableResource for our account at all and stay INACTIVE."
    by: bridgend84
    evidence: audit-runs/2026-10-31.tar.xz
    date: 2026-11-02

  # ---------------------------------------------------------------- upcloud
