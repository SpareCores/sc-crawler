  - vendor: aws
    type: SPEC_MISMATCH
    field: memory_gib
    match: "db\\.m8g\\.(12|16|24)xlarge"
    verdict: confirmed
    note: "RDS docs and our EC2 m8g servers say 192/256/384 GiB; ours (256/384/512) come from the RDS Price List 'memory' attribute, which is wrong for these classes (the pricing page feed has the same values). _aws.inventory_databases reads product['memory']; the linked EC2 server's memory would be right."
    by: claude (cursor)
    evidence: audit-runs/2026-11-04.tar.xz
    date: 2026-11-04
  - vendor: aws
    type: SPEC_MISMATCH
    field: storage_gb
    page: "^rds-instance-classes$"
    verdict: to_verify
    note: "Ours = docs x 1.074 for all classes with instance storage. The RDS docs label the column GiB, _extract_rds_bundled_storage_size converts it to GB, but the EC2 docs give the same disks in GB (e.g. r6gd.large '1 x 118 GB') and our EC2 server stores 118 while db.r6gd.large stores 127. Check the real disk size, then align servers and databases."
    by: claude (cursor)
    evidence: audit-runs/2026-11-04.tar.xz
    date: 2026-11-04
  - vendor: aws
    type: SPEC_MISMATCH
