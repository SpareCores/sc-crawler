        follow:
          pattern: "learn\\.microsoft\\.com/en-us/azure/virtual-machines/sizes/(general-purpose|compute-optimized|memory-optimized|storage-optimized|gpu-accelerated|fpga-accelerated|high-performance-compute)/[a-z0-9-]+-(series|family)$"
