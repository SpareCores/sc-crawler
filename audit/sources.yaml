# Official vendor pages used by `sc-audit` to cross-check our data.
#
# Only first-party vendor domains are allowed (see `allowed_domains`).
#
# Page fields:
# - kinds: what the page is authoritative for (server_specs, server_prices,
#   component_rates, gpu, db_specs, db_prices, db_features, regions, lifecycle).
# - covers: regex on our SKU ids/names that the page is authoritative for.
# - complete: the page lists all SKUs matching `covers`. For pages with a
#   `region`, this applies to the prices in that region; otherwise to specs.
#   Our active records missing from all complete pages are reported as
#   possibly not existing at the vendor.
# - independent: false if our ingest reads the very same source.
# - parser: deterministic parser for machine-readable sources (no LLM needed).
# - follow: also fetch linked child pages matching a regex.

vendors:
  aws:
    allowed_domains: [aws.amazon.com, docs.aws.amazon.com, b0.p.awsstatic.com, website.spot.ec2.aws.a2z.com]
    reference_regions: [us-east-1, eu-central-1]
    pages:
      - id: ec2-ondemand-use1
        url: "https://b0.p.awsstatic.com/pricing/2.0/meteredUnitMaps/ec2/USD/current/ec2-ondemand-without-sec-sel/US%20East%20(N.%20Virginia)/Linux/index.json"
        kinds: [server_specs, server_prices]
        region: us-east-1
        complete: true
        spec_authority: false
        parser: aws_ec2_ondemand
        notes: Data feed of aws.amazon.com/ec2/pricing/on-demand/ (Linux, shared tenancy).
      - id: ec2-ondemand-euc1
        url: "https://b0.p.awsstatic.com/pricing/2.0/meteredUnitMaps/ec2/USD/current/ec2-ondemand-without-sec-sel/EU%20(Frankfurt)/Linux/index.json"
        kinds: [server_specs, server_prices]
        region: eu-central-1
        complete: true
        spec_authority: false
        parser: aws_ec2_ondemand
      - id: ec2-spot
        url: "https://website.spot.ec2.aws.a2z.com/spot.json"
        kinds: [server_prices]
        parser: aws_ec2_spot
        notes: Data feed of aws.amazon.com/ec2/spot/pricing/; spot prices change frequently.
      - id: rds-postgresql-ondemand
        url: "https://b0.p.awsstatic.com/pricing/2.0/meteredUnitMaps/rds/USD/current/rds-postgresql-ondemand.json"
        kinds: [db_specs, db_prices]
        spec_authority: false
        parser: aws_rds_postgresql
        notes: Data feed of aws.amazon.com/rds/postgresql/pricing/.
      - id: instancetypes-gp
        url: "https://docs.aws.amazon.com/ec2/latest/instancetypes/gp.html"
        kinds: [server_specs]
        covers: "^(m\\d|t\\d|mac|a1)"
        complete: true
      - id: instancetypes-co
        url: "https://docs.aws.amazon.com/ec2/latest/instancetypes/co.html"
        kinds: [server_specs]
        covers: "^c\\d"
        complete: true
      - id: instancetypes-mo
        url: "https://docs.aws.amazon.com/ec2/latest/instancetypes/mo.html"
        kinds: [server_specs]
        covers: "^(r\\d|x\\d|u-|u\\d|z1d)"
        complete: true
      - id: instancetypes-so
        url: "https://docs.aws.amazon.com/ec2/latest/instancetypes/so.html"
        kinds: [server_specs]
        covers: "^(i\\d|d\\d|h1|im4|is4)"
        complete: true
      - id: instancetypes-ac
        url: "https://docs.aws.amazon.com/ec2/latest/instancetypes/ac.html"
        kinds: [server_specs, gpu]
        covers: "^(p\\d|g\\d|f\\d|inf\\d|trn\\d|dl\\d|vt\\d)"
        complete: true
      - id: instancetypes-hpc
        url: "https://docs.aws.amazon.com/ec2/latest/instancetypes/hpc.html"
        kinds: [server_specs]
        covers: "^hpc"
        complete: true
      - id: instancetypes-pg
        url: "https://docs.aws.amazon.com/ec2/latest/instancetypes/pg.html"
        kinds: [server_specs, lifecycle]
        notes: Previous generation instance types.
      - id: rds-instance-classes
        url: "https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.DBInstanceClass.Summary.html"
        kinds: [db_specs]
        notes: Hardware specs of the DB instance classes of all engines (not PostgreSQL specific).
      - id: rds-engine-support
        url: "https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.DBInstanceClass.Support.html"
        kinds: [db_specs]
        covers: "^db\\."
        complete: true
        notes: >-
          Supported DB engines per instance class. Extract only the classes supported
          for PostgreSQL (one db_specs row per class, sku only).
      - id: rds-limits
        url: "https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/CHAP_Limits.html"
        kinds: [db_features]
      - id: rds-backup-retention
        url: "https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_WorkingWithAutomatedBackups.BackupRetention.html"
        kinds: [db_features]
      - id: rds-multi-az
        url: "https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZSingleStandby.html"
        kinds: [db_features]
      - id: rds-multi-az-cluster
        url: "https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/multi-az-db-clusters-concepts.html"
        kinds: [db_features]
      - id: rds-sla
        url: "https://aws.amazon.com/rds/sla/"
        kinds: [db_features]
      - id: rds-postgresql-versions
        url: "https://docs.aws.amazon.com/AmazonRDS/latest/PostgreSQLReleaseNotes/postgresql-release-calendar.html"
        kinds: [db_features]
      - id: instance-types-g6
        url: "https://aws.amazon.com/ec2/instance-types/g6/"
        kinds: [server_specs, gpu]
        notes: "Cited in _aws.py for GPU details."
      - id: instance-types-r8i
        url: "https://aws.amazon.com/ec2/instance-types/r8i/"
        kinds: [server_specs]
      - id: rds-read-replicas
        url: "https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_PostgreSQL.Replication.ReadReplicas.Configuration.html"
        kinds: [db_features]
      - id: rds-automated-backups
        url: "https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_WorkingWithAutomatedBackups.html"
        kinds: [db_features]
      - id: regions
        url: "https://docs.aws.amazon.com/global-infrastructure/latest/regions/aws-regions.html"
        kinds: [regions]
        complete: true

